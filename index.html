
<!DOCTYPE html>
<html>
<head>
    <title>My First Web Page</title>

    <!-- Internal CSS -->
    <style>
        body {
            background-color: lightblue;
            font-family: Arial;
            text-align: center;
        }

        h1 {
            color: darkblue;
        }

        p {
            color: black;
            font-size: 18px;
        }

        .box {
            background-color: white;
            padding: 30px;
            margin: 100px auto;
            width: 300px;
            border-radius: 10px;
        }

        button {
            background-color: blue;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
        }
    </style>
</head>

<body>

    <div class="box">
        <h1>Welcome!</h1>

        <p>This is my first HTML webpage.</p>

        <p>I am learning HTML and CSS.</p>

        <button>Click Me</button>
    </div>

</body>
</html>
